<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'" />
  <title>SkinMatrix Till</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f3f7; color: #14142b; font: 16px/1.5 'Inter', 'Segoe UI', system-ui, sans-serif; }
    main { max-width: 460px; padding: 32px; background: #fff; border: 1px solid #e1e1ea; border-radius: 16px; text-align: center; }
    h1 { font: 700 24px/1.2 'Satoshi', 'Segoe UI', system-ui, sans-serif; margin: 0 0 8px; }
    p { color: #5f5f79; margin: 0 0 20px; }
    button { font: 600 15px/1 inherit; padding: 14px 22px; border-radius: 10px; border: 0; background: #1d1d50; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Waiting for the internet</h1>
    <p>The till needs the internet once, the first time it starts. After that it also works offline. It will try again by itself.</p>
    <button type="button" id="retry">Try again now</button>
  </main>
  <script>
    const target = new URLSearchParams(location.search).get('url')
    const retry = () => { if (target) location.href = target }
    document.getElementById('retry').addEventListener('click', retry)
    setInterval(() => { if (navigator.onLine) retry() }, 10000)
  </script>
</body>
</html>
